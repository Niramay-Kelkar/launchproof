[pytest]
# backend/tests/ imports backend-level modules directly (glasser_client,
# research_adapter, launchproof.*) the way main.py does -- that only works
# if backend/ itself is on sys.path. Pytest's own rootdir-walk sys.path
# insertion only adds the first ancestor directory *without* an __init__.py,
# which for backend/tests/ (no __init__.py) is backend/tests itself, not
# backend/ -- so "import glasser_client" fails when collecting from the
# repo root. `pythonpath` is pytest's standard, plugin-free fix for this
# (added in pytest 7.0): it adds the given path(s) to sys.path for the
# whole test session, independent of each test file's own directory.
pythonpath = backend
testpaths = backend/tests backend/launchproof/tests
